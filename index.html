<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ラグビーAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/style.css">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
<link rel="manifest" href="assets/site.webmanifest">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poetsen+One&family=Yusei+Magic&display=swap" rel="stylesheet">
</head>

<!-- ↓ここから追加（</body>の直前）↓ -->
<div id="image-viewer" class="image-viewer-hidden">
    <button id="viewer-close-btn">×</button>
    
    <!-- ★ここから2行を追加（PC用の左右ボタン） -->
    <button id="viewer-prev-btn" class="viewer-nav-btn">◀</button>
    <button id="viewer-next-btn" class="viewer-nav-btn">▶</button>
    <!-- ★ここまで -->

    <img id="viewer-img" src="" alt="拡大画像">
</div>
<!-- ↑ここまで↑ -->

<body>
  <header class="header">
    <div class="header__title">ラグビーAI</div>
  </header>

  <main class="chat-container">
    <button id="history-toggle-btn" class="history-toggle-btn">≡ 履歴</button>
    <div id="history-container" class="history-container"></div>
    
    <div id="chat" class="chat"></div>
    <div id="chatEnd"></div>
    
    <!-- ↓ここから追加（</body>の直前）↓ -->
    <div id="image-viewer" class="image-viewer-hidden">
      <button id="viewer-close-btn">×</button>
      <img id="viewer-img" src="" alt="拡大画像">
    </div>
    <!-- ↑ここまで↑ -->
    
  </main>

  <footer class="input-area">
    <div class="save-btn-wrapper">
      <button id="save-btn" class="save-btn">保存</button>
    </div>
    
    <div class="input-box">
      <textarea id="question" placeholder="ラグビーのルールに関する質問はなんですか？" rows="2"></textarea>
      <button id="sendBtn">送信</button>
    </div>
  </footer>

  <script src="script.js?ver=2"></script>
</body>
</html>
